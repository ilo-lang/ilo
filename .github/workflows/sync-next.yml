name: sync next from main

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: next
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Try fast-forward, then 3-way merge
        id: ff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge --ff-only origin/main; then
            echo "result=ff" >> "$GITHUB_OUTPUT"
            git push origin next
          elif git merge --no-ff origin/main -m "chore(sync): merge main into next [automated]"; then
            # Non-ff but clean 3-way merge: push the merge commit to next.
            # Only falls through to the PR step on true conflict.
            echo "result=merged" >> "$GITHUB_OUTPUT"
            git push origin next
          else
            git merge --abort || true
            echo "result=diverged" >> "$GITHUB_OUTPUT"
          fi
      - name: Open sync PR if diverged
        if: steps.ff.outputs.result == 'diverged'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: chore/sync-next-from-main
          base: next
          title: "chore: sync next from main"
          body: |
            Automated PR — `next` could not fast-forward from `main`.
            Resolve any conflicts, then merge to bring `next` current.
          delete-branch: true
