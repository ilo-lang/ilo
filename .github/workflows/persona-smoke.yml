name: Persona smoke regression

# Triggered when any skill module changes (the thing this harness guards),
# or when ai.txt changes (backward compat — ai.txt is generated from SPEC.md
# so a spec change that touches the bundled copy also triggers the smoke run).
# Also runnable manually via workflow_dispatch for ad-hoc baseline refreshes.
on:
  pull_request:
    paths:
      - 'skills/ilo/**'
      - 'ai.txt'
  push:
    branches: ['main', 'next']
    paths:
      - 'skills/ilo/**'
      - 'ai.txt'
  workflow_dispatch:
    inputs:
      record_baseline:
        description: 'Record a fresh baseline (writes bench/persona-smoke-baseline.json and opens a PR)'
        type: boolean
        default: false

jobs:
  persona-smoke:
    name: Persona corpus smoke run
    runs-on: ubuntu-latest
    # Needs the Anthropic key to call Haiku.  Store as repo/org secret.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Fetch full history so the baseline JSON on main is accessible
          # when this runs on a PR branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install tiktoken

      - name: Install ilo binary
        run: bash skills/ilo/scripts/ensure-ilo.sh

      - name: Print skill-module token sizes
        # Always emit the token report in CI so cap progress is visible in the
        # job summary without needing to open a separate run.
        run: python3 scripts/persona-smoke.py --token-report

      # ── Baseline refresh path (manual dispatch only) ───────────────────────
      - name: Record fresh baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_baseline }}
        run: python3 scripts/persona-smoke.py --baseline

      - name: Open PR with updated baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_baseline }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/persona-smoke-baseline-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add bench/persona-smoke-baseline.json
          git commit -m "chore: refresh persona-smoke baseline [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: refresh persona-smoke baseline" \
            --body "Auto-generated by the persona-smoke workflow (manual dispatch).  Review the delta in \`bench/persona-smoke-baseline.json\` before merging." \
            --base main \
            --head "$BRANCH"

      # ── Regression comparison path (PR / push) ─────────────────────────────
      - name: Run persona smoke set and compare against baseline
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_baseline) }}
        run: python3 scripts/persona-smoke.py

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-smoke-results
          path: bench/persona-smoke-baseline.json
          if-no-files-found: ignore
